<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DevMate AI</title>

    <link rel="stylesheet" href="css/auth.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    
</head>

<body>

<!-- ── Animated Background ─────────────────────────────────── -->
<div class="background">
    <canvas id="bgCanvas"></canvas>
    <!-- Glowing orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <!-- Grid overlay -->
    <div class="bg-grid"></div>
</div>

<!-- ── Login Container ─────────────────────────────────────── -->
<div class="login-container">

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">

            <div class="logo-circle">
                <!-- Neural + code icon matching reference -->
                <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Neural ring -->
                    <circle cx="22" cy="18" r="9" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
                    <!-- Core -->
                    <circle cx="22" cy="18" r="3.5" fill="white" opacity="0.95"/>
                    <!-- Neural nodes -->
                    <circle cx="13" cy="11" r="2" fill="white" opacity="0.8"/>
                    <circle cx="31" cy="11" r="2" fill="white" opacity="0.8"/>
                    <circle cx="13" cy="25" r="2" fill="white" opacity="0.8"/>
                    <circle cx="31" cy="25" r="2" fill="white" opacity="0.8"/>
                    <circle cx="22" cy="8"  r="2" fill="white" opacity="0.8"/>
                    <!-- Neural connections -->
                    <line x1="13" y1="11" x2="19" y2="16" stroke="white" stroke-width="1.2" opacity="0.45"/>
                    <line x1="31" y1="11" x2="25" y2="16" stroke="white" stroke-width="1.2" opacity="0.45"/>
                    <line x1="13" y1="25" x2="19" y2="20" stroke="white" stroke-width="1.2" opacity="0.45"/>
                    <line x1="31" y1="25" x2="25" y2="20" stroke="white" stroke-width="1.2" opacity="0.45"/>
                    <line x1="22" y1="8"  x2="22" y2="14" stroke="white" stroke-width="1.2" opacity="0.45"/>
                    <!-- Code brackets < / > -->
                    <path d="M13 32 L9 36 L13 40"  stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
                    <path d="M31 32 L35 36 L31 40" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
                    <line x1="19" y1="41" x2="25" y2="31" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.88"/>
                </svg>
            </div>

            <h1><span class="title-white">DevMate</span> <span class="title-purple">AI</span></h1>

            <p>AI Developer Assistant</p>

            <div class="logo-divider">
                <div class="divider-dot"></div>
            </div>

        </div>

        <!-- Form -->
        <form id="loginForm" novalidate>

            <!-- Email -->
            <div class="input-group">

                <label>Email Address</label>

                <div class="input-wrap">
                    <span class="input-icon">📧</span>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

            </div>

            <!-- Password -->
            <div class="input-group">

                <label>Password</label>

                <div class="password-box input-wrap">
                    <span class="input-icon">🔒</span>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                    <button type="button" id="togglePassword" class="eye-btn">👁️</button>

                    
                </div>

            </div>

            <!-- Remember Me + Forgot -->
            <div class="options">

                <label class="remember-label">
                    <input type="checkbox" class="custom-check">
                    <span class="checkmark"></span>
                    Remember Me
                </label>

                <a href="forgot-password.html">Forgot Password?</a>

            </div>

            <!-- Login button -->
            <button class="login-btn" type="submit">
                Login
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Google -->
            <button type="button" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" style="flex-shrink:0">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <!-- Guest -->
            <button type="button" class="guest-btn">
                👤 Continue as Guest
            </button>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </form>

    </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<script src="js/login.js"></script>

<script>
/* ── Background Canvas Particles ─────────────────────────── */
(function () {
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    let W, H, particles = [];

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function Particle() {
        this.x  = Math.random() * W;
        this.y  = Math.random() * H;
        this.r  = Math.random() * 1.5 + 0.3;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.a  = Math.random() * 0.6 + 0.1;
    }

    function initParticles(n) {
        particles = [];
        for (let i = 0; i < n; i++) particles.push(new Particle());
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
            if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(139,92,246,${p.a})`;
            ctx.fill();
        });

        /* connect nearby particles */
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(99,102,241,${0.12 * (1 - dist / 120)})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(draw);
    }

    resize();
    initParticles(80);
    draw();
    window.addEventListener("resize", () => { resize(); initParticles(80); });
})();
</script>

</body>
</html>
